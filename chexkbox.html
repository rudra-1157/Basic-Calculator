<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Box Example</title>
    <link rel="stylesheet" href="checkbox.css">
</head>
<body>

    <input type="checkbox" id="myCheckBox">
    <label for="myCheckBox">Subscribe</label><br><br>

    <input type="radio" id="myvisa" name="card">
    <label for="myvisa">Visa</label><br>

    <input type="radio" id="mymastercard" name="card">
    <label for="mymastercard">Mastercard</label><br>

    <input type="radio" id="mypaypal" name="card">
    <label for="mypaypal">Paypal</label><br><br>

    <input type="submit" id="mysubmit">
    <label for="mysubmit"></label><br><br>


    <p id="subresult"></p>
    <p id="paymentstatus"></p>


    <script src="checkbox.js"></script>
</body>
</html>
